server {
    listen 3000;
    server_name _;

    # Use Kubernetes CoreDNS for dynamic service resolution
    # Prevents nginx from caching stale pod IPs after restarts
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static React build files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API REVERSE PROXY ----
    # Using variables forces nginx to re-resolve DNS on every request

    # Product Service
    location /api/products/ {
        set $product_upstream http://product-service:4000;
        proxy_pass $product_upstream/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/products {
        set $product_upstream http://product-service:4000;
        proxy_pass $product_upstream/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cart Service
    location /api/cart/ {
        set $cart_upstream http://cart-service:4001;
        proxy_pass $cart_upstream/cart/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/cart {
        set $cart_upstream http://cart-service:4001;
        proxy_pass $cart_upstream/cart;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Order Service
    location /api/orders/ {
        set $order_upstream http://order-service:4002;
        proxy_pass $order_upstream/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/orders {
        set $order_upstream http://order-service:4002;
        proxy_pass $order_upstream/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # User Service
    location /api/users/ {
        set $user_upstream http://user-service:4003;
        proxy_pass $user_upstream/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/users {
        set $user_upstream http://user-service:4003;
        proxy_pass $user_upstream/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Notification Service
    location /api/notifications/ {
        set $notif_upstream http://notification-service:4004;
        proxy_pass $notif_upstream/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/notifications {
        set $notif_upstream http://notification-service:4004;
        proxy_pass $notif_upstream/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Inventory Service
    location /api/inventory/ {
        set $inventory_upstream http://inventory-service:4005;
        proxy_pass $inventory_upstream/inventory/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/inventory {
        set $inventory_upstream http://inventory-service:4005;
        proxy_pass $inventory_upstream/inventory;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"frontend-service"}';
        add_header Content-Type application/json;
    }
}
