# ==============================================================
# ObserveFlow — Infra CI Pipeline
# ==============================================================
# Triggers on push/PR to main (infra/helm changes only)
#
# Stages:
#   1. Checkov     → Terraform security scan
#   2. Checkov     → Helm chart security scan
#   3. kubeconform → Helm manifest validation
# ==============================================================

name: Infra CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'helm/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'helm/**'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Checkov — Terraform scan
  # ─────────────────────────────────────────────────────────────
  checkov-terraform:
    name: Checkov — Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          skip_check: >-
            CKV_AWS_39,CKV_AWS_58,CKV_AWS_136,CKV_AWS_130,
            CKV_AWS_355,CKV_AWS_290,CKV_AWS_289,
            CKV2_AWS_12,CKV2_AWS_11,CKV_AWS_38
          soft_fail: false
          output_format: cli

  # ─────────────────────────────────────────────────────────────
  # Job 2: Checkov — Helm chart scan
  # ─────────────────────────────────────────────────────────────
  checkov-helm:
    name: Checkov — Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Helm
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm/
          framework: helm
          soft_fail: true
          output_format: cli

  # ─────────────────────────────────────────────────────────────
  # Job 3: kubeconform — Helm manifest validation
  # ─────────────────────────────────────────────────────────────
  kubeconform:
    name: Helm Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Build Helm dependencies
        run: helm dependency build ./helm/observeflow || true

      - name: Render and validate Helm templates
        run: |
          helm template observeflow ./helm/observeflow \
            -f helm/observeflow/values-local.yaml \
            | kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary
