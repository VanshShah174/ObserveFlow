apiVersion: v2
name: observeflow
description: ObserveFlow - Polyglot E-Commerce Microservices Platform
type: application
version: 0.4.0
appVersion: "1.0.0"
keywords:
  - microservices
  - e-commerce
  - observability
  - opentelemetry
maintainers:
  - name: Vansh Shah

dependencies:
  # Prometheus + Grafana (metrics + dashboards)
  - name: kube-prometheus-stack
    version: "62.7.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: observability.enabled

  # Loki (log aggregation)
  - name: loki
    version: "6.16.0"
    repository: https://grafana.github.io/helm-charts
    condition: observability.enabled

  # Jaeger (distributed tracing UI)
  - name: jaeger
    version: "3.3.1"
    repository: https://jaegertracing.github.io/helm-charts
    condition: observability.enabled

  # NOTE: OpenTelemetry Operator is installed as a prerequisite (not a subchart)
  # because it requires cert-manager and creates ServiceMonitors that conflict
  # when bundled. Install via: scripts/setup.sh
