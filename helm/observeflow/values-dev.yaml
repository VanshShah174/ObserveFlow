# ============================================================================
# DEV VALUES — AWS EKS deployment
# Usage: helm install observeflow ./helm/observeflow -f ./helm/observeflow/values-dev.yaml
# ============================================================================

global:
  namespace: observeflow
  imageTag: "latest"

# ECR image repositories
frontend:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/frontend-service
    pullPolicy: Always

productService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/product-service
    pullPolicy: Always

cartService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/cart-service
    pullPolicy: Always

orderService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/order-service
    pullPolicy: Always

userService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/user-service
    pullPolicy: Always

notificationService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/notification-service
    pullPolicy: Always

inventoryService:
  replicas: 1
  image:
    repository: 207446234524.dkr.ecr.us-east-1.amazonaws.com/observeflow/inventory-service
    pullPolicy: Always

# Gateway API — disabled until AWS Gateway API Controller is installed
gateway:
  enabled: false

# Observability — AWS mode (ADOT + managed services, no local stack)
observability:
  enabled: false  # Disables local stack (Jaeger, Loki, Prometheus, Grafana)
  aws:
    enabled: true
    region: us-east-1
    clusterName: observeflow-eks
    ampEndpoint: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-3c587827-a3f0-46e1-a760-89dd83109735/"
    logGroupName: "/aws/eks/observeflow-eks/application"

# Karpenter — disabled until Karpenter Helm chart is installed
karpenter:
  enabled: false
