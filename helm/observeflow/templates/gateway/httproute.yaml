{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: observeflow-routes
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "observeflow.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: observeflow-gateway
      namespace: {{ .Values.global.namespace }}
  rules:
    # Frontend — catch-all for UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.frontendService.name }}
          port: {{ .Values.frontendService.port }}
    # Product Service API
    - matches:
        - path:
            type: PathPrefix
            value: /products
      backendRefs:
        - name: {{ .Values.productService.name }}
          port: {{ .Values.productService.port }}
    # Cart Service API
    - matches:
        - path:
            type: PathPrefix
            value: /cart
      backendRefs:
        - name: {{ .Values.cartService.name }}
          port: {{ .Values.cartService.port }}
    # Order Service API
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: {{ .Values.orderService.name }}
          port: {{ .Values.orderService.port }}
    # User Service API
    - matches:
        - path:
            type: PathPrefix
            value: /users
      backendRefs:
        - name: {{ .Values.userService.name }}
          port: {{ .Values.userService.port }}
    # Notification Service API
    - matches:
        - path:
            type: PathPrefix
            value: /notifications
      backendRefs:
        - name: {{ .Values.notificationService.name }}
          port: {{ .Values.notificationService.port }}
    # Inventory Service API
    - matches:
        - path:
            type: PathPrefix
            value: /inventory
      backendRefs:
        - name: {{ .Values.inventoryService.name }}
          port: {{ .Values.inventoryService.port }}
{{- end }}
