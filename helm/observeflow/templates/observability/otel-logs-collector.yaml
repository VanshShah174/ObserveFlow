{{- if .Values.observability.enabled }}
# ==============================================================
# OTel Collector — Log Collection DaemonSet
# ==============================================================
# Runs one pod per node. Reads container logs from /var/log/pods
# and ships them to Loki.
#
# This is separate from the main OTel Collector (Deployment)
# which handles traces and metrics via OTLP.
# ==============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-logs-collector-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: otel-logs-collector
    {{- include "observeflow.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/{{ .Values.global.namespace }}_*/*/*.log
        exclude:
          - /var/log/pods/{{ .Values.global.namespace }}_otel-*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: regex_parser
            id: extract_metadata_from_filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod>[^\/]+)\/(?P<container>[^\/]+)\/.*.log$'
            parse_from: attributes["log.file.path"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.container
            to: resource["k8s.container.name"]

    processors:
      batch:
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_mib: 256
      resource:
        attributes:
          - key: loki.resource.labels
            value: k8s.namespace.name,k8s.pod.name,k8s.container.name
            action: upsert

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    exporters:
      loki:
        endpoint: {{ .Values.observability.loki.endpoint }}

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch, resource]
          exporters: [loki]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-logs-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    app: otel-logs-collector
    {{- include "observeflow.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: otel-logs-collector
  template:
    metadata:
      labels:
        app: otel-logs-collector
    spec:
      serviceAccountName: observeflow-sa
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-logs-collector
          image: otel/opentelemetry-collector-contrib:0.108.0
          ports:
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: config
          configMap:
            name: otel-logs-collector-config
{{- end }}
