{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-observeflow
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "observeflow.labels" . | nindent 4 }}
data:
  observeflow-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "title": "Request Rate (per service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(rate(observeflow_http_server_duration_milliseconds_count[5m])) by (job)",
              "legendFormat": "{{`{{job}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Error Rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(rate(observeflow_http_server_duration_milliseconds_count{http_status_code=~\"5..\"}[5m])) by (job)",
              "legendFormat": "{{`{{job}}`}} errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "drawStyle": "line", "fillOpacity": 10 },
              "color": { "mode": "fixed", "fixedColor": "red" }
            }
          }
        },
        {
          "title": "P95 Latency (per service)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": null,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(observeflow_http_server_duration_milliseconds_bucket[5m])) by (le, job))",
              "legendFormat": "{{`{{job}}`}} p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            }
          }
        },
        {
          "title": "Cart Items Added (Counter)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(observeflow_cart_items_added_total) by (product_id)",
              "legendFormat": "Product {{`{{product_id}}`}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "fillOpacity": 20 }
            }
          }
        },
        {
          "title": "Cart Items Current (Gauge)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(observeflow_cart_items_current)",
              "legendFormat": "Items in carts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 50 }
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["observeflow", "microservices"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "ObserveFlow — Service Overview",
      "uid": "observeflow-overview",
      "version": 1
    }
{{- end }}
