{{- if and .Values.observability.enabled (.Capabilities.APIVersions.Has "opentelemetry.io/v1alpha1") }}
# ==============================================================
# OpenTelemetry Auto-Instrumentation CR
# ==============================================================
# Deploys automatically on 'helm upgrade' (after operator is ready).
# On first install, apply manually:
#   kubectl apply -f instrumentation-cr.yaml -n observeflow
# ==============================================================
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: observeflow-instrumentation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observeflow.labels" . | nindent 4 }}
spec:
  exporter:
    endpoint: http://otel-collector.{{ .Release.Namespace }}.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  nodejs:
    env:
      - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
        value: "http,express,dns,net"
  python:
    env:
      - name: OTEL_PYTHON_EXCLUDED_URLS
        value: "health"
  java:
    env:
      - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
        value: "true"
{{- end }}
