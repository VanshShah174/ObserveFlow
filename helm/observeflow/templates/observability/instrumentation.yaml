{{- if .Values.observability.enabled }}
# ==============================================================
# OpenTelemetry Auto-Instrumentation CR
# ==============================================================
# Requires: OTel Operator installed as prerequisite (scripts/setup.sh)
# After install, restart deployments to inject instrumentation:
#   kubectl rollout restart deployment -n <namespace>
# ==============================================================
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: observeflow-instrumentation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observeflow.labels" . | nindent 4 }}
spec:
  exporter:
    endpoint: http://otel-collector.{{ .Release.Namespace }}.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
  nodejs:
    env:
      - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
        value: "http,express,dns,net"
  python:
    env:
      - name: OTEL_PYTHON_EXCLUDED_URLS
        value: "health"
  java:
    env:
      - name: OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED
        value: "true"
{{- end }}
