{{- if .Values.observability.enabled }}
# ==============================================================
# Grafana Datasources — Loki + Jaeger (additional)
# ==============================================================
# Prometheus is already provisioned by kube-prometheus-stack.
# We only add Loki and Jaeger here.
# ==============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-extra
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_datasource: "1"
    {{- include "observeflow.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Loki — logs
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki-gateway.{{ .Values.global.namespace }}.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: '"traceId":"(\\w+)"'
              name: TraceID
              url: "$${__value.raw}"

      # Jaeger — traces (allInOne mode: query is served by the same pod)
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://{{ .Release.Name }}-jaeger-all-in-one.{{ .Values.global.namespace }}.svc.cluster.local:16686
        uid: jaeger
        isDefault: false
        editable: false
{{- end }}
