{{- if .Values.observability.enabled }}
# ==============================================================
# Grafana Datasources — pre-configured for zero-setup demo
# ==============================================================
# Grafana automatically loads these on startup.
# No manual configuration needed during demo.
# ==============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.global.namespace }}
  labels:
    grafana_datasource: "1"
    {{- include "observeflow.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus — metrics
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://observeflow-kube-prometheus-stack-prometheus:9090
        isDefault: true
        editable: false

      # Loki — logs
      - name: Loki
        type: loki
        access: proxy
        url: http://observeflow-loki:3100
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: "traceId=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"

      # Jaeger — traces
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://observeflow-jaeger-all-in-one:16686
        uid: jaeger
        editable: false
{{- end }}
