apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.notificationService.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.notificationService.name }}
    {{- include "observeflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.notificationService.name }}
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
      protocol: TCP
